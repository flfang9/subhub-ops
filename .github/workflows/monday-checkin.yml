name: monday-checkin
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC = 7am EDT; GH cron queue runs 2-3h late, so this lands ~9am
  workflow_dispatch:
    inputs:
      test_mode:
        description: "post then immediately delete (e2e test)"
        type: boolean
        default: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/post_checkin.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TEST_DELETE: ${{ inputs.test_mode && 'true' || 'false' }}
